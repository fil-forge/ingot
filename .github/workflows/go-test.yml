name: Go Test

# Three-stage test pipeline mirroring the local `make test` / `make dbtest` /
# `make itest` split: fast unit tests and the DSN-gated Postgres suite run
# first (in parallel), and the Docker-backed integration suite (itest/) only
# runs once both pass — a broken unit test or migration fails the PR in ~2
# minutes instead of tying up a runner booting the Forge stack.

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    uses: ipdxco/unified-github-workflows/.github/workflows/go-test.yml@1822b44541e3ad073b8f9109e346ba0ddd4ce96e # v1.0
    with:
      go-versions: '["this"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The live-Postgres suite: `migrations.Up` against a real server plus the
  # SQL-backed registry stores (jsonb, bytea[], ON CONFLICT, the latch's
  # RowsAffected semantics). Both packages skip unless INGOT_TEST_DSN is set,
  # so they are invisible to the unit job — this job is the only thing that
  # catches a DDL error in a new migration before it reaches forge-mode
  # startup. Runs in parallel with `unit`.
  dbtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ingot
        # 55432 on the host matches the DSN documented in the live tests, so
        # the CI and local invocations are the same command.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run the live migration + registry tests
        env:
          GOWORK: off
          INGOT_TEST_DSN: postgres://postgres:pw@127.0.0.1:55432/ingot
        run: go test -count=1 -v -run Live ./registry/ ./migrations/

  itest:
    needs: [unit, dbtest]
    # Pin to 24.04 rather than -latest so the Docker version doesn't drift
    # from under us. The runner's preinstalled Docker is 28.x, well past
    # smelt's 25+ requirement.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Run integration tests
        # GOWORK=off matches the Makefile convention (a parent go.work may
        # declare a newer Go than the toolchain). The harness builds the
        # working-tree binary itself (itest/stack_test.go).
        env:
          GOWORK: off
        run: go test -tags itest -v -timeout 20m ./itest

      - name: Dump container state on failure
        if: failure()
        run: |
          mkdir -p /tmp/container-logs

          {
            echo "=== docker ps -a ==="
            docker ps -a
            echo
            echo "=== docker network ls ==="
            docker network ls
            echo
            echo "=== docker volume ls ==="
            docker volume ls
          } | tee /tmp/container-logs/_overview.txt

          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "/tmp/container-logs/$c.log" 2>&1 || true
            echo "::group::$c"
            tail -200 "/tmp/container-logs/$c.log"
            echo "::endgroup::"
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-logs
          path: /tmp/container-logs/
          if-no-files-found: ignore
          retention-days: 7
