name: Go Test

# Fast unit tests (the shared unified workflow) and the env-gated live tests
# (real Postgres + OpenBao as service containers) run in parallel, and the
# Docker-backed suites only run once the unit job passes — a broken unit test
# fails the PR in ~2 minutes instead of tying up runners booting the Forge
# stack. The live job exists because the unit job runs the same packages with
# no INGOT_TEST_* env, silently skipping every *_live_test.go.
#
# The Docker-backed work spreads over five runners: four `itest-shards` and
# `s3compat`, which runs the compatibility corpus (the shards leave
# INGOT_S3COMPAT unset, so TestForgeS3Compat skips itself there). Shard
# membership lives in the Makefile, target `itest-shard`; job `itest`
# aggregates the shards into the one check the branch ruleset requires.
#
# A runner per shard is what makes the split pay: itest/ is a single Go
# package, so its tests run serially and each one boots its own Forge stack.
# Two of them also cannot share a Docker host, because itest/'s TestMain
# sweeps every leaked `smeltery-*` container on startup — which would take
# out the other run's live stack.
#
# On main, the S3 compatibility report the s3compat job produces is also
# published to GitHub Pages (job `pages`), so the current state of ingot's
# S3 compatibility is always readable at the repo's Pages URL without
# digging a build artifact out of a run.

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    uses: ipdxco/unified-github-workflows/.github/workflows/go-test.yml@e08e90c46d931f457e5d8e292ffa988c0c0b5b70 # v1.0
    with:
      go-versions: '["this"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  live:
    # The env-gated live tests: the SQL-backed stores and migrations against
    # a real Postgres, and the OpenBao transit provider against a real
    # OpenBao — behavior the in-memory fakes and httptest doubles cannot
    # prove (bytea[] round-trips, CHECK constraints, derived-context
    # binding, key rotation). Cheap enough to run in parallel with unit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ingot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      openbao:
        image: openbao/openbao:2.6.2
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports:
          - 8200:8200
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run live tests
        env:
          GOWORK: off
          INGOT_TEST_DSN: postgres://postgres:pw@127.0.0.1:55432/ingot
          INGOT_TEST_BAO_ADDR: http://127.0.0.1:8200
          INGOT_TEST_BAO_TOKEN: root
        run: go test -v -count=1 -run '(Live|GraphValidates)' ./cmd/... ./registry/ ./migrations/ ./regionkey/

  itest-shards:
    needs: unit
    # Pin to 24.04 rather than -latest so the Docker version doesn't drift
    # from under us. The runner's preinstalled Docker is 28.x, well past
    # smelt's 25+ requirement.
    runs-on: ubuntu-24.04
    # The slowest shard is ~6 minutes of tests on top of ~2 minutes of image
    # pulls and the working-tree ingot build. Comfortably above `make
    # itest-shard`'s own -timeout 20m, so a hung test hits Go's timeout and
    # dumps goroutine stacks before the runner is cut off.
    timeout-minutes: 25

    strategy:
      # A failing shard must not cancel the others: which shards fail is the
      # diagnosis, and a rerun of one shard costs a full stack boot.
      fail-fast: false
      matrix:
        include:
          - shard: encryption
          - shard: conformance
          - shard: uploads
            # Enables TestForgeMaxSizePart, the 5 GiB max-part test, which
            # this shard owns. Move that test between shards in the Makefile
            # and move this flag with it, or it silently stops running.
            big: '1'
          - shard: rest

    name: itest (${{ matrix.shard }})

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Docker and disk info
        # df because the `uploads` shard's 5 GiB part test churns ~10-15 GiB
        # (spool copy + piri copy): the runner image starts with ~73 GiB free,
        # so this records the margin rather than needing anything freed.
        run: |
          docker version
          docker compose version
          df -h /

      - name: Run integration tests
        # The Makefile owns which tests each shard runs, the -run regex, and
        # GOWORK=off; `rest` is the complement, so a newly added test runs
        # there rather than matching no shard at all. The harness builds the
        # working-tree binary itself (itest/stack_test.go).
        env:
          INGOT_ITEST_BIG: ${{ matrix.big }}
        run: make itest-shard SHARD=${{ matrix.shard }}

      - name: Dump container state on failure
        if: failure()
        run: |
          mkdir -p /tmp/container-logs

          {
            echo "=== docker ps -a ==="
            docker ps -a
            echo
            echo "=== docker network ls ==="
            docker network ls
            echo
            echo "=== docker volume ls ==="
            docker volume ls
          } | tee /tmp/container-logs/_overview.txt

          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "/tmp/container-logs/$c.log" 2>&1 || true
            echo "::group::$c"
            tail -200 "/tmp/container-logs/$c.log"
            echo "::endgroup::"
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Per shard: upload-artifact rejects a name another job already used.
          name: container-logs-${{ matrix.shard }}
          path: /tmp/container-logs/
          if-no-files-found: ignore
          retention-days: 7

  itest:
    # The branch ruleset requires a check named `itest`, and a matrix reports
    # one check per shard instead. This job keeps the single name and fails
    # unless every shard passed — `needs.<job>.result` for a matrix is the
    # aggregate, and !cancelled() means a failed shard reaches here rather
    # than skipping the gate into a green PR.
    needs: itest-shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every shard to pass
        run: |
          echo "itest shards: ${{ needs.itest-shards.result }}"
          test "${{ needs.itest-shards.result }}" = success

  s3compat:
    needs: unit
    # Its own runner, alongside `itest` — see the header comment: the two
    # suites each boot a Forge stack, and one `go test` process's startup
    # sweep would remove the other's containers.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      # 'true' when the S3 compatibility report was staged and uploaded as
      # the Pages artifact (main only); gates the `pages` job.
      pages-artifact: ${{ steps.upload-pages.outcome == 'success' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate S3 compatibility report
        # TestForgeS3Compat runs the s3vectors corpus and reports each vector
        # as a subtest, so it exits non-zero whenever the target is
        # incomplete — expected for ingot, and not a build failure.
        # continue-on-error keeps the job green; the report is uploaded next
        # regardless. -timeout 30m rather than 20m because this runner now
        # pulls the stack images cold, and the stack boots inside the test's
        # own clock.
        #
        # INGOT_S3COMPAT_LARGE runs the vectors tagged large, which move ~10 GiB
        # through the stack (the 5 GiB copy-source limit needs a source over
        # 5 GiB). That is minutes of runner time for an edge case that rarely
        # moves, so it is enabled where the published report is produced and on
        # demand, but not on every PR. Drop the condition to run it everywhere.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GOWORK: off
          INGOT_S3COMPAT: 1
          INGOT_S3COMPAT_OUT: ${{ github.workspace }}/s3-compat-report.html
          INGOT_S3COMPAT_LARGE: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '1' || '' }}
        run: go test -tags itest -v -timeout 30m -run TestForgeS3Compat ./itest

      - name: Upload S3 compatibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: s3-compat-report
          path: s3-compat-report.html
          if-no-files-found: warn
          retention-days: 90

      - name: Stage S3 compatibility report for GitHub Pages
        # Only on main, and only when the report was actually written (the
        # generate step is continue-on-error, so a run that died before
        # writing it still reaches here). The report becomes the site's
        # index so the Pages URL opens it directly.
        id: stage-pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('s3-compat-report.html') != '' }}
        run: |
          mkdir -p _site
          cp s3-compat-report.html _site/index.html

      - name: Upload GitHub Pages artifact
        id: upload-pages
        if: ${{ !cancelled() && steps.stage-pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  pages:
    # Publishes the report staged by s3compat. Runs whenever that artifact
    # was uploaded, even if the integration tests themselves failed — the
    # corpus runs on its own runner against its own stack and is independent
    # evidence. Requires the repo's Pages source to be "GitHub Actions".
    needs: s3compat
    if: ${{ !cancelled() && needs.s3compat.outputs.pages-artifact == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    # One Pages deployment at a time, never cancelled mid-flight: a
    # half-applied deployment is worse than a briefly stale one.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
