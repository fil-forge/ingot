name: Go Test

# Three test jobs mirroring the local split: fast unit tests (the shared
# unified workflow) and the env-gated live tests (real Postgres + OpenBao as
# service containers) run in parallel, and the Docker-backed integration
# suite (itest/) only runs once the unit job passes — a broken unit test
# fails the PR in ~2 minutes instead of tying up a runner booting the Forge
# stack. The live job exists because the unit job runs the same packages
# with no INGOT_TEST_* env, silently skipping every *_live_test.go.

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    uses: ipdxco/unified-github-workflows/.github/workflows/go-test.yml@1822b44541e3ad073b8f9109e346ba0ddd4ce96e # v1.0
    with:
      go-versions: '["this"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  live:
    # The env-gated live tests: the SQL-backed stores and migrations against
    # a real Postgres, and the OpenBao transit provider against a real
    # OpenBao — behavior the in-memory fakes and httptest doubles cannot
    # prove (bytea[] round-trips, CHECK constraints, derived-context
    # binding, key rotation). Cheap enough to run in parallel with unit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ingot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      openbao:
        image: openbao/openbao:2.6.2
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports:
          - 8200:8200
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run live tests
        env:
          GOWORK: off
          INGOT_TEST_DSN: postgres://postgres:pw@127.0.0.1:55432/ingot
          INGOT_TEST_BAO_ADDR: http://127.0.0.1:8200
          INGOT_TEST_BAO_TOKEN: root
        run: go test -v -count=1 -run '(Live|GraphValidates)' ./cmd/... ./registry/ ./migrations/ ./regionkey/

  itest:
    needs: unit
    # Pin to 24.04 rather than -latest so the Docker version doesn't drift
    # from under us. The runner's preinstalled Docker is 28.x, well past
    # smelt's 25+ requirement.
    runs-on: ubuntu-24.04
    # Room for the main itest run (-timeout 40m) plus the S3 compatibility
    # report, which boots its own stack.
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Free runner disk space
        # The 5 GiB max-part test (INGOT_ITEST_BIG) churns ~10-15 GiB
        # (spool copy + piri copy); drop the runner's preinstalled bloat
        # so it fits alongside the stack images.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Run integration tests
        # GOWORK=off matches the Makefile convention (a parent go.work may
        # declare a newer Go than the toolchain). The harness builds the
        # working-tree binary itself (itest/stack_test.go).
        # INGOT_ITEST_BIG enables the 5 GiB max-part test, which local
        # `make itest` runs skip (itest/README.md).
        env:
          GOWORK: off
          INGOT_ITEST_BIG: 1
        run: go test -tags itest -v -timeout 40m ./itest

      - name: Dump container state on failure
        if: failure()
        run: |
          mkdir -p /tmp/container-logs

          {
            echo "=== docker ps -a ==="
            docker ps -a
            echo
            echo "=== docker network ls ==="
            docker network ls
            echo
            echo "=== docker volume ls ==="
            docker volume ls
          } | tee /tmp/container-logs/_overview.txt

          for c in $(docker ps -a --format '{{.Names}}'); do
            docker logs "$c" > "/tmp/container-logs/$c.log" 2>&1 || true
            echo "::group::$c"
            tail -200 "/tmp/container-logs/$c.log"
            echo "::endgroup::"
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-logs
          path: /tmp/container-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate S3 compatibility report
        # TestForgeS3Compat runs the s3vectors corpus and reports each vector
        # as a subtest, so it exits non-zero whenever the target is
        # incomplete — expected for ingot, and not a build failure.
        # continue-on-error keeps the job green; the report is uploaded next
        # regardless. Runs even if the itest run above failed (it boots its
        # own stack), but not on cancellation.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GOWORK: off
          INGOT_S3COMPAT: 1
          INGOT_S3COMPAT_OUT: ${{ github.workspace }}/s3-compat-report.html
        run: go test -tags itest -v -timeout 20m -run TestForgeS3Compat ./itest

      - name: Upload S3 compatibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: s3-compat-report
          path: s3-compat-report.html
          if-no-files-found: warn
          retention-days: 90
