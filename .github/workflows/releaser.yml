name: Releaser

# When version.json changes on main, the unified releaser cuts the git tag
# and GitHub release for that version. Binaries + containers are then built by
# the Binaries Releaser workflow (release-binaries.yml) on completion.
on:
  push:
    paths: [ 'version.json' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  releaser:
    uses: ipdxco/unified-github-workflows/.github/workflows/releaser.yml@e08e90c46d931f457e5d8e292ffa988c0c0b5b70 # v1.0
