name: Container

# Build the ingot daemon image and publish it to GHCR on merges to main.
# Mirrors sprue's dev/prod pattern so smelt can pull a consistent
# ghcr.io/fil-forge/ingot:main (prod) and :main-dev (debug + dlv) pair.
# ingot has no releaser, so this is the PR build-check + publish-on-main
# half of sprue's workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new pushes to the same ref.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Publish both prod and dev images on push to main.
  #   prod -> :main, :sha-<short>
  #   dev  -> :main-dev, :sha-<short>-dev
  publish-main:
    name: Publish ${{ matrix.target }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Resolving the pull request this commit merged from, for the link the
      # bump pull request carries.
      pull-requests: read
    strategy:
      matrix:
        include:
          - target: prod
            suffix: ""
          - target: dev
            suffix: "-dev"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main${{ matrix.suffix }}
            type=sha,suffix=${{ matrix.suffix }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      # The dev node pins the prod image, so only that leg asks for a deploy. A
      # dispatch from the dev leg would put the delve-equipped debug build on
      # the node.
      - name: Resolve the source pull request
        if: matrix.target == 'prod'
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_url=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq 'map(select(.merged_at != null)) | .[0].html_url // ""')
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      # Scoped down at mint time: this token can reach infra-nodes and nothing
      # else in the organisation.
      - name: Mint fil-forge-bot token
        if: matrix.target == 'prod'
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FORGE_BOT_APP_ID }}
          private-key: ${{ secrets.FORGE_BOT_PRIVATE_KEY }}
          owner: fil-forge
          repositories: infra-nodes

      # infra-nodes rewrites its pin and opens a pull request with auto-merge
      # armed. Merging queues the image; the node deploys it on its next
      # reconcile pass.
      - name: Request a digest bump on the dev node
        if: matrix.target == 'prod'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PR_URL: ${{ steps.source.outputs.pr_url }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::unexpected digest: '$DIGEST'"; exit 1; }
          jq -n \
            --arg service ingot \
            --arg digest "$DIGEST" \
            --arg source_repo "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg pr_url "$PR_URL" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{event_type: "bump-deployed-image",
              client_payload: {service: $service, digest: $digest,
                               source_repo: $source_repo, commit: $commit,
                               pr_url: $pr_url, run_url: $run_url}}' \
            | gh api --method POST repos/fil-forge/infra-nodes/dispatches --input -

  # PR build check (no push) - both targets, single platform for speed.
  build-check:
    name: Build Check (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [dev, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
